<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Floor - Školní Simulátor (ABC)</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
            --primary: #3b82f6;
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
            --floor-cell: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); padding: 20px; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; margin-bottom: 10px; text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        .subtitle { text-align: center; color: #94a3b8; margin-bottom: 30px; }

        .btn {
            background-color: var(--primary); color: white; border: none; padding: 12px 24px;
            font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.2s;
        }
        .btn:hover:not(:disabled) { filter: brightness(1.2); transform: translateY(-2px); }
        .btn:disabled { background-color: #475569; cursor: not-allowed; opacity: 0.6; }
        .btn-success { background-color: var(--success); }
        .btn-warning { background-color: var(--warning); color: #0f172a; }
        .btn-danger { background-color: var(--danger); }
        .btn-block { width: 100%; margin-bottom: 10px; padding: 15px; }

        .btn-abc {
            background-color: #334155; border: 2px solid #475569; color: white;
            padding: 15px; font-size: 1.1rem; text-align: left; border-radius: 8px;
            cursor: pointer; width: 100%; transition: all 0.2s; display: block; margin-bottom: 10px;
        }
        .btn-abc:hover { background-color: #475569; border-color: var(--warning); }

        select, input[type="text"] {
            padding: 10px 15px; font-size: 1rem; border-radius: 6px;
            border: 1px solid #475569; background-color: #1e293b; color: white;
        }

        .setup-controls {
            display: flex; justify-content: center; align-items: center; gap: 15px;
            margin-bottom: 30px; background: var(--card-bg); padding: 20px; border-radius: 12px;
        }
        .inputs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .student-input-card { background: var(--card-bg); padding: 15px; border-radius: 8px; border-left: 4px solid var(--primary); display: flex; flex-direction: column; gap: 8px; }
        .student-input-card label { font-size: 0.85rem; color: #94a3b8; }
        .student-input-card .row { display: flex; gap: 8px; }
        .input-initials { width: 70px; text-transform: uppercase; text-align: center; }
        .select-topic { flex-grow: 1; }

        .game-layout { display: grid; grid-template-columns: 300px 1fr; gap: 30px; margin-top: 20px; }
        .control-panel { display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid #334155; }
        .card h3 { margin-bottom: 15px; border-bottom: 2px solid #334155; padding-bottom: 5px; }
        .status-box { background: #1e293b; padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; border: 1px dashed var(--primary); margin-top: 10px; }

        .floor-wrapper { background: #020617; padding: 20px; border-radius: 16px; display: flex; justify-content: center; align-items: center; }
        .floor-grid { display: grid; gap: 8px; width: 100%; max-width: 550px; }
        .floor-cell {
            background-color: var(--floor-cell); border: 2px solid #475569; border-radius: 6px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: all 0.3s ease; position: relative; overflow: hidden; padding: 5px; aspect-ratio: 1;
        }
        .cell-owner { font-size: 1.6rem; font-weight: 900; color: white; text-shadow: 1px 1px 4px black; }
        .cell-topic { font-size: 0.75rem; color: #cbd5e1; text-align: center; margin-top: 4px; }

        .floor-cell.active-attacker { background-color: var(--danger) !important; border-color: white; box-shadow: 0 0 15px var(--danger); }
        .floor-cell.valid-target { background-color: var(--primary) !important; border-color: white; cursor: pointer; box-shadow: 0 0 15px var(--primary); }
        .floor-cell.valid-target:hover { transform: scale(1.05); filter: brightness(1.3); }
        .floor-cell.eliminated { background-color: #1e293b !important; opacity: 0.2; border-style: dotted; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(2, 6, 23, 0.95); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--card-bg); padding: 30px; border-radius: 16px; width: 90%; max-width: 750px; border: 2px solid var(--primary); }
        .topic-badge { background: #334155; padding: 8px 16px; border-radius: 20px; width: fit-content; margin: 10px auto 25px auto; font-weight: bold; color: var(--warning); border: 1px solid var(--warning); }
        
        .duel-arena { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; gap: 20px; }
        .player-zone { flex: 1; background: #0f172a; padding: 15px; border-radius: 12px; text-align: center; border: 2px solid transparent; }
        .player-zone.active-turn { border-color: var(--warning); background: #1e1b4b; }
        .p-name { font-size: 1.3rem; font-weight: bold; margin-bottom: 5px; }
        .p-timer { font-size: 2.8rem; font-family: monospace; font-weight: bold; }
        .player-zone.active-turn .p-timer { color: var(--warning); }
        .vs-divider { font-size: 1.5rem; font-weight: 900; color: #64748b; }

        .quiz-box { background: #0f172a; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
        .question-text { font-size: 1.3rem; text-align: center; margin-bottom: 20px; min-height: 50px; font-weight: 600; }
        .abc-container { margin-bottom: 20px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>
  <!-- 1. SETUP SCREEN -->
    <div id="setup-screen" class="container">
        <h1>🎮 THE FLOOR – ŠKOLNÍ DUEL (ABC VERZE)</h1>
        <p class="subtitle">Načítání témat ze společného souboru otazkyf.txt pomocí mřížky #</p>
        
        <div class="setup-controls">
            <label for="student-count">Počet žáků:</label>
            <select id="student-count">
                <option value="4">4 žáci (Mřížka 2x2)</option>
                <option value="5">5 žáků (Mřížka 3x2)</option>
                <option value="6">6 žáků (Mřížka 3x2)</option>
                <option value="7">7 žáků (Mřížka 3x3)</option>
                <option value="8">8 žáků (Mřížka 3x3)</option>
                <option value="9">9 žáků (Mřížka 3x3)</option>
                <option value="10">10 žáků (Mřížka 4x3)</option>
                <option value="11">11 žáků (Mřížka 4x3)</option>
                <option value="12" selected>12 žáků (Mřížka 4x3)</option>
                <option value="13">13 žáků (Mřížka 4x4)</option>
                <option value="14">14 žáků (Mřížka 4x4)</option>
                <option value="15">15 žáků (Mřížka 4x4)</option>
                <option value="16">16 žáků (Mřížka 4x4)</option>
            </select>
            <button id="btn-generate-inputs" class="btn">Připravit jmenný seznam</button>
        </div>

        <div id="students-inputs-container" class="inputs-grid"></div>
        <button id="btn-start-game" class="btn btn-success hidden">🚀 NAČÍST OTÁZKY A SPUSTIT</button>
    </div>

    <!-- 2. GAME BOARD SCREEN -->
    <div id="game-screen" class="container hidden">
        <header class="game-header">
            <h1>📐 HRACÍ PODLAHA</h1>
            <div id="game-status" class="status-box">Načítám data...</div>
        </header>

        <div class="game-layout">
            <div class="control-panel">
                <div class="card">
                    <h3>🎲 Akce kola</h3>
                    <button id="btn-randomize" class="btn btn-primary btn-block">Vylosovat vyzyvatele</button>
                    <button id="btn-pass-turn" class="btn btn-warning btn-block hidden">Předat slovo randomizéru</button>
                </div>
            </div>
            <div class="floor-wrapper">
                <div id="floor-grid" class="floor-grid"></div>
            </div>
        </div>
    </div>

    <!-- OZNAMOVACÍ PROSTŘEDÍ PRO PŘEDÁVÁNÍ MYŠI A KONEC DUELU -->
    <div id="game-overlay" class="modal hidden" style="z-index: 2000; text-align: center; background-color: rgba(2, 6, 23, 0.98);">
        <div style="color: white; padding: 40px;">
            <h1 id="overlay-title" style="font-size: 3rem; margin-bottom: 20px; color: var(--warning);">PŘEDEJTE MYŠ!</h1>
            <p id="overlay-subtitle" style="font-size: 1.5rem; color: #94a3b8; margin-bottom: 40px;">Na řadě je druhý hráč.</p>
            <button id="btn-overlay-continue" class="btn btn-success" style="font-size: 1.5rem; padding: 20px 40px;">👉 POKRAČOVAT</button>
        </div>
    </div>

    <!-- 3. DUEL MODAL SCREEN -->
    <div id="duel-modal" class="modal hidden">
        <div class="modal-content">
            <h2 style="text-align:center;">🔥 VĚDOMOSTNÍ DUEL 🔥</h2>
            <div id="duel-topic-name" class="topic-badge">Téma: ???</div>

            <div class="duel-arena">
                <div id="p1-zone" class="player-zone">
                    <div id="p1-name" class="p-name">Útočník</div>
                    <div id="p1-timer" class="p-timer">45.0</div>
                </div>
                <div class="vs-divider" style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
                    <div>VS</div>
                    <div id="time-lock-indicator" style="font-size: 0.8rem; background: var(--success); color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; min-width: 80px; text-align: center;">ČAS BĚŽÍ</div>
                </div>
                <div id="p2-zone" class="player-zone">
                    <div id="p2-name" class="p-name">Obránce</div>
                    <div id="p2-timer" class="p-timer">45.0</div>
                </div>
            </div>

            <div class="quiz-box">
                <div id="quiz-question" class="question-text">Načítám otázku...</div>
                <div class="abc-container">
                    <button id="btn-opt-A" class="btn-abc">A) ---</button>
                    <button id="btn-opt-B" class="btn-abc">B) ---</button>
                    <button id="btn-opt-C" class="btn-abc">C) ---</button>
                </div>
                <button id="btn-quiz-pass" class="btn btn-danger btn-block">✖️ NEVÍM / PŘESKOČIT (DÁLE)</button>
            </div>
        </div>
    </div>

    <script>
        // Globální databáze a proměnné
        let QUIZ_DATABASE = {};
        let THEMES_LIST = [];

        let PLAYER_COLORS = [
            "#1e3a8a", "#065f46", "#7c2d12", "#581c87", "#a21caf", "#0f766e",
            "#4d7c0f", "#b45309", "#1d4ed8", "#6b7280", "#be185d", "#374151"
        ];
        
        let gameState = {
            totalCells: 12, rows: 3, cols: 4, grid: [],
            attackerIndex: null, defenderIndex: null,
            currentRoundQuestions: [], currentQuestionIdx: 0,
            activeTurnPlayer: null, timers: { p1: 45, p2: 45 },
            timerInterval: null, isClickLocked: false, isTimeFrozen: false
        };

        // DOM Elementy
        const setupScreen = document.getElementById('setup-screen');
        const gameScreen = document.getElementById('game-screen');
        const duelModal = document.getElementById('duel-modal');
        const studentCountSelect = document.getElementById('student-count');
        const btnGenerateInputs = document.getElementById('btn-generate-inputs');
        const inputsContainer = document.getElementById('students-inputs-container');
        const btnStartGame = document.getElementById('btn-start-game');
        const floorGrid = document.getElementById('floor-grid');
        const gameStatus = document.getElementById('game-status');
        const btnRandomize = document.getElementById('btn-randomize');
        const btnPassTurn = document.getElementById('btn-pass-turn');
        const duelTopicName = document.getElementById('duel-topic-name');
        const p1Name = document.getElementById('p1-name');
        const p2Name = document.getElementById('p2-name');
        const p1Timer = document.getElementById('p1-timer');
        const p2Timer = document.getElementById('p2-timer');
        const quizQuestion = document.getElementById('quiz-question');
        const btnOptA = document.getElementById('btn-opt-A');
        const btnOptB = document.getElementById('btn-opt-B');
        const btnOptC = document.getElementById('btn-opt-C');
        const btnQuizPass = document.getElementById('btn-quiz-pass');

        // ZVUKOVÝ ENGINE (Táhlé tóny a velkolepá fanfára)
        const AudioEngine = {
            ctx: null,
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            play(type) {
                this.init();
                const now = this.ctx.currentTime;
                if (type === 'correct') { 
                    this.playTone(523.25, now, 0.40); this.playTone(659.25, now + 0.15, 0.45); this.playTone(783.99, now + 0.30, 0.60);
                } else if (type === 'wrong') { 
                    this.playTone(196.00, now, 0.50, 'sawtooth'); this.playTone(164.81, now + 0.30, 0.55, 'sawtooth'); this.playTone(130.81, now + 0.60, 0.80, 'sawtooth');
                } else if (type === 'victory') { 
                    this.playTone(261.63, now, 0.50); this.playTone(329.63, now + 0.15, 0.50); this.playTone(392.00, now + 0.30, 0.50);
                    this.playTone(523.25, now + 0.45, 0.60); this.playTone(659.25, now + 0.60, 0.60); this.playTone(783.99, now + 0.75, 0.70);
                    this.playTone(1046.50, now + 0.90, 0.80); this.playTone(1318.51, now + 1.05, 0.90); this.playTone(1567.98, now + 1.20, 1.20);
                    this.playTone(2093.00, now + 1.35, 1.50);
                }
            },
            playTone(freq, startTime, duration, waveType = 'sine') {
                const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                osc.type = waveType; osc.frequency.setValueAtTime(freq, startTime);
                gain.gain.setValueAtTime(0.15, startTime);
                gain.gain.linearRampToValueAtTime(0.15, startTime + (duration * 0.4));
                gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(startTime); osc.stop(startTime + duration);
            }
        };
         
           // 3A: ASYNCHRONNÍ NAČTENÍ OTÁZEK Z otazkyf.txt (OPRAVENÁ VERZE)
        async function loadQuestionsFromTXT() {
            try {
                const response = await fetch('otazkyf.txt');
                if (!response.ok) throw new Error('Soubor otazkyf.txt nenalezen');
                const text = await response.text();
                
                // 🔥 OPRAVENO: Čisté rozdělení řádků podle konců souborů
                const lines = text.split(/\r?\n/);
                
                let currentTheme = null; QUIZ_DATABASE = {};
                lines.forEach(line => {
                    const trimmedLine = line.trim(); if (!trimmedLine) return;
                    if (trimmedLine.startsWith('#')) {
                        currentTheme = trimmedLine.replace('#', '').trim(); QUIZ_DATABASE[currentTheme] = []; return;
                    }
                    if (currentTheme && trimmedLine.includes(';')) {
                        const parts = trimmedLine.split(';');
                        if (parts.length >= 5) {
                            QUIZ_DATABASE[currentTheme].push({
                                q: parts[0].trim(), optA: parts[1].trim(), optB: parts[2].trim(), optC: parts[3].trim(), a: parts[4].trim().toUpperCase()
                            });
                        }
                    }
                });
                THEMES_LIST = Object.keys(QUIZ_DATABASE);
                if (THEMES_LIST.length === 0) throw new Error('Nebyla nalezena žádná témata uvozená #');
            } catch (error) {
                console.error(error.message);
                QUIZ_DATABASE["Záložní Téma"] = [{ q: "Chybí soubor otazkyf.txt nebo je špatně uvozen znakem # !", optA: "A) Rozumím", optB: "B) Rozumím", optC: "C) Rozumím", a: "A" }];
                THEMES_LIST = Object.keys(QUIZ_DATABASE);
            }
        }

        // GENERÁTOR VSTUPŮ ŽÁKŮ
        btnGenerateInputs.addEventListener('click', async () => {
            btnGenerateInputs.disabled = true; btnGenerateInputs.innerText = "Načítám témata...";
            await loadQuestionsFromTXT();
            const count = parseInt(studentCountSelect.value); gameState.totalCells = count;
            
            if (count === 4) { gameState.rows = 2; gameState.cols = 2; }
            else if (count <= 6) { gameState.rows = 2; gameState.cols = 3; }
            else if (count <= 9) { gameState.rows = 3; gameState.cols = 3; }
            else if (count <= 12) { gameState.rows = 3; gameState.cols = 4; }
            else { gameState.rows = 4; gameState.cols = 4; }

            inputsContainer.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const card = document.createElement('div'); card.className = 'student-input-card';
                const label = document.createElement('label'); label.innerText = `Žák č. ${i + 1}`;
                const row = document.createElement('div'); row.className = 'row';
                const input = document.createElement('input'); input.type = 'text'; input.maxLength = 3; input.className = 'input-initials';
                input.value = String.fromCharCode(65 + (i % 26)) + String.fromCharCode(66 + (i % 26));
                const select = document.createElement('select'); select.className = 'select-topic';
                THEMES_LIST.forEach(t => {
                    const opt = document.createElement('option'); opt.value = t; opt.innerText = t; select.appendChild(opt);
                });
                select.value = THEMES_LIST[i % THEMES_LIST.length];
                row.appendChild(input); row.appendChild(select); card.appendChild(label); card.appendChild(row); inputsContainer.appendChild(card);
            }
            btnGenerateInputs.disabled = false; btnGenerateInputs.innerText = "Připravit jmenný seznam";
            btnStartGame.classList.remove('hidden');
        });

        // SPUŠTĚNÍ HRY
        btnStartGame.addEventListener('click', () => {
            const initInputs = document.querySelectorAll('.input-initials');
            const topicSelects = document.querySelectorAll('.select-topic');
            gameState.grid = []; const cellsCount = gameState.rows * gameState.cols;
            for (let i = 0; i < cellsCount; i++) {
                if (i < gameState.totalCells) {
                    gameState.grid.push({ id: i, initials: initInputs[i].value.toUpperCase() || `Ž${i+1}`, originalOwner: i, currentOwner: i, topic: topicSelects[i].value, eliminated: false });
                } else {
                    gameState.grid.push({ id: i, initials: "-", originalOwner: -1, currentOwner: -1, topic: "", eliminated: true });
                }
            }
            setupScreen.classList.add('hidden'); gameScreen.classList.remove('hidden');
            gameStatus.innerText = "Hra načtena. Klikněte na Vylosovat vyzyvatele."; renderFloor();
        });
        
         // 3B: VYKRESLENÍ PODLAHY (PŘEHLEDNÁ ZMENŠENÁ VERZE)
        function renderFloor() {
            floorGrid.innerHTML = '';
            floorGrid.style.gridTemplateColumns = `repeat(${gameState.cols}, 1fr)`;
            floorGrid.style.gridTemplateRows = `repeat(${gameState.rows}, 1fr)`;
            floorGrid.style.aspectRatio = `${gameState.cols} / ${gameState.rows}`;

            let validOpponents = [];
            if (gameState.attackerIndex !== null && gameState.defenderIndex === null) { 
                validOpponents = getNeighbors(gameState.attackerIndex); 
            }

            gameState.grid.forEach((cell, idx) => {
                const div = document.createElement('div'); div.className = 'floor-cell';
                if (cell.eliminated || cell.currentOwner === -1) {
                    div.classList.add('eliminated'); div.innerHTML = `<span class="cell-owner">❌</span>`;
                } else {
                    const ownerData = gameState.grid.find(c => c.originalOwner === cell.currentOwner);
                    const isEliminated = cell.originalOwner !== cell.currentOwner;

                    if (isEliminated) {
                        div.innerHTML = `
                            <span class="cell-owner" style="font-size: 0.8rem; opacity: 0.3; font-weight: normal; text-decoration: line-through;">${cell.initials}</span>
                            <span class="cell-topic" style="font-size: 1.2rem; font-weight: 900; opacity: 1; color: #ffffff;">👑 ${ownerData ? ownerData.initials : ''}</span>
                        `;
                        div.style.borderStyle = "dashed";
                    } else {
                        div.innerHTML = `
                            <span class="cell-owner" style="font-size: 1.6rem; font-weight: 900;">${cell.initials}</span>
                            <span class="cell-topic" style="font-size: 0.75rem; color: #cbd5e1;">${ownerData ? ownerData.topic : ''}</span>
                        `;
                        div.style.borderStyle = "solid";
                    }
                    const colorIdx = cell.currentOwner % PLAYER_COLORS.length;
                    div.style.backgroundColor = PLAYER_COLORS[colorIdx];
                    if (gameState.attackerIndex !== null && cell.currentOwner === gameState.attackerIndex) {
                        div.classList.add('active-attacker'); div.style.backgroundColor = "";
                    }
                    if (validOpponents.includes(cell.currentOwner)) {
                        div.classList.add('valid-target'); div.style.backgroundColor = "";
                        div.onclick = () => startDuel(cell.currentOwner);
                    }
                }
                floorGrid.appendChild(div);
            });
        }

        function getNeighbors(ownerId) {
            const neighbors = new Set();
            gameState.grid.forEach((cell, idx) => {
                if (cell.currentOwner === ownerId && !cell.eliminated) {
                    const r = Math.floor(idx / gameState.cols); const c = idx % gameState.cols;
                    const directions = [{ r: r - 1, c: c }, { r: r + 1, c: c }, { r: r, c: c - 1 }, { r: r, c: c + 1 }];
                    directions.forEach(d => {
                        if (d.r >= 0 && d.r < gameState.rows && d.c >= 0 && d.c < gameState.cols) {
                            const nIdx = d.r * gameState.cols + d.c; const targetCell = gameState.grid[nIdx];
                            if (targetCell.currentOwner !== -1 && targetCell.currentOwner !== ownerId && !targetCell.eliminated) neighbors.add(targetCell.currentOwner);
                        }
                    });
                }
            });
            return Array.from(neighbors);
        }

        // RANDOMIZÉR
        btnRandomize.addEventListener('click', () => {
            btnPassTurn.classList.add('hidden');
            const activeOwners = Array.from(new Set(gameState.grid.filter(c => !c.eliminated && c.currentOwner !== -1).map(c => c.currentOwner)));
            if (activeOwners.length <= 1) { checkGameEnd(); return; }
            const pickedOwner = activeOwners[Math.floor(Math.random() * activeOwners.length)];
            gameState.attackerIndex = pickedOwner; gameState.defenderIndex = null;
            const attackerData = gameState.grid.find(c => c.originalOwner === pickedOwner);
            gameStatus.innerText = `🎲 Randomizér vybral žáka [ ${attackerData.initials} ]. Vyberte souseda kliknutím na podlahu!`;
            if (getNeighbors(pickedOwner).length === 0) {
                gameState.attackerIndex = null; setTimeout(() => btnRandomize.click(), 500); return;
            }
            renderFloor();
        });

// 3C: SPUŠTĚNÍ DUELU (S OPRAVENÝM ODEMYKÁNÍM KLIKÁNÍ A PERZISTENTNÍ PAUZOU)
        function startDuel(defenderId) {
            gameState.defenderIndex = defenderId;
            const attackerData = gameState.grid.find(c => c.originalOwner === gameState.attackerIndex);
            const defenderData = gameState.grid.find(c => c.originalOwner === defenderId);
            const activeTopic = defenderData.topic;
            duelTopicName.innerText = `Téma: ${activeTopic}`;
            p1Name.innerText = `⚔️ Útočník: ${attackerData.initials}`; p2Name.innerText = `🛡️ Obránce: ${defenderData.initials}`;

            const remainingQuestions = QUIZ_DATABASE[activeTopic] || [];
            if (remainingQuestions.length === 0) {
                gameState.currentRoundQuestions = [{ q: "V tomto tématu již nejsou otázky!", optA: "A) Pokračovat", optB: "B) Pokračovat", optC: "C) Pokračovat", a: "A" }];
            } else {
                gameState.currentRoundQuestions = [...remainingQuestions].sort(() => Math.random() - 0.5);
            }
            gameState.currentQuestionIdx = 0; gameState.timers.p1 = 45.0; gameState.timers.p2 = 45.0;
            p1Timer.innerText = "45.0"; p2Timer.innerText = "45.0";
            
            gameState.activeTurnPlayer = 2; 
            
            // 🔥 AUTOMATICKÉ ODEMČENÍ KLIKÁNÍ PRO NOVÝ DUEL (Odstraňuje zásek ve 2. duelu!)
            gameState.isClickLocked = false; 

            document.getElementById('p2-zone').classList.add('active-turn'); document.getElementById('p1-zone').classList.remove('active-turn');
            const ind = document.getElementById('time-lock-indicator'); if (ind) { 
                if (gameState.isTimeFrozen) { ind.innerText = "PAUZA (T)"; ind.style.backgroundColor = "var(--danger)"; }
                else { ind.innerText = "ČAS BĚŽÍ"; ind.style.backgroundColor = "var(--success)"; }
            }

            duelModal.classList.remove('hidden'); showNextQuestion(); 
            
            // Čas se spustí pouze pokud ho učitel předem nevypnul klávesou T
            if (!gameState.isTimeFrozen) startTimerLoop();
        }

        // ZOBRAZENÍ ABC OTÁZKY S POJISTKOU PROTI PÁDŮM
        function showNextQuestion() {
            let defenderData = gameState.grid.find(c => c.originalOwner === gameState.defenderIndex);
            let currentTopic = "Záložní Téma";
            if (defenderData && defenderData.topic) {
                currentTopic = defenderData.topic;
            } else {
                currentTopic = duelTopicName.innerText.replace('Téma: ', '').trim();
            }

            if (gameState.currentQuestionIdx >= gameState.currentRoundQuestions.length) {
                const remaining = QUIZ_DATABASE[currentTopic] || [];
                if (remaining.length > 0) {
                    gameState.currentRoundQuestions = [...remaining].sort(() => Math.random() - 0.5); gameState.currentQuestionIdx = 0;
                } else {
                    quizQuestion.innerText = "Otázky vyčerpány! Stiskněte Nevím / Přeskočit."; return;
                }
            }
            const currentQ = gameState.currentRoundQuestions[gameState.currentQuestionIdx];
            if (QUIZ_DATABASE[currentTopic] && currentQ) {
                const dbIndex = QUIZ_DATABASE[currentTopic].findIndex(item => item.q === currentQ.q);
                if (dbIndex !== -1) QUIZ_DATABASE[currentTopic].splice(dbIndex, 1);
            }
            if (currentQ) {
                quizQuestion.innerText = currentQ.q; btnOptA.innerText = currentQ.optA; btnOptB.innerText = currentQ.optB; btnOptC.innerText = currentQ.optC;
            }
        }

        // ČASOVÁ LOOP
        function startTimerLoop() {
            if (gameState.timerInterval) clearInterval(gameState.timerInterval);
            gameState.timerInterval = setInterval(() => {
                if (gameState.activeTurnPlayer === 1) {
                    gameState.timers.p1 -= 0.1;
                    if (gameState.timers.p1 <= 0) { gameState.timers.p1 = 0; p1Timer.innerText = "0.0"; endDuel(); }
                    p1Timer.innerText = gameState.timers.p1.toFixed(1);
                } else {
                    gameState.timers.p2 -= 0.1;
                    if (gameState.timers.p2 <= 0) { gameState.timers.p2 = 0; p2Timer.innerText = "0.0"; endDuel(); }
                    p2Timer.innerText = gameState.timers.p2.toFixed(1);
                }
            }, 100);
        }

        // KONTROLA ODPOVĚDI (S PŘEDÁVACÍ PAUZOU)
        function selectABC(letter) {
            if (gameState.isClickLocked) return;
            gameState.isClickLocked = true;
            const currentQ = gameState.currentRoundQuestions[gameState.currentQuestionIdx];
            
            if (letter === currentQ.a) {
                clearInterval(gameState.timerInterval); gameState.timerInterval = null;
                AudioEngine.play('correct');
                gameState.currentQuestionIdx++; gameState.activeTurnPlayer = gameState.activeTurnPlayer === 1 ? 2 : 1;
                const nextPlayerId = (gameState.activeTurnPlayer === 1) ? gameState.attackerIndex : gameState.defenderIndex;
                const nextPlayerCell = gameState.grid.find(c => c.originalOwner === nextPlayerId);
                
                setTimeout(() => {
                    document.getElementById('overlay-title').innerText = "🤝 PŘEDEJTE MYŠ!";
                    document.getElementById('overlay-subtitle').innerText = `Na řadě je: ${nextPlayerCell ? nextPlayerCell.initials : 'Soupeř'}`;
                    document.getElementById('game-overlay').classList.remove('hidden');
                }, 450);
            } else {
                AudioEngine.play('wrong'); quizQuestion.style.color = "var(--danger)";
                const penalty = gameState.isTimeFrozen ? 8 : 3;
                if (gameState.activeTurnPlayer === 1) { gameState.timers.p1 = Math.max(0, gameState.timers.p1 - penalty); p1Timer.innerText = gameState.timers.p1.toFixed(1); }
                else { gameState.timers.p2 = Math.max(0, gameState.timers.p2 - penalty); p2Timer.innerText = gameState.timers.p2.toFixed(1); }
                gameState.currentQuestionIdx++;
                if (gameState.timers.p1 <= 0 || gameState.timers.p2 <= 0) { endDuel(); return; }
                setTimeout(() => { quizQuestion.style.color = "var(--text-light)"; showNextQuestion(); gameState.isClickLocked = false; }, 400);
            }
        }

        btnOptA.addEventListener('click', () => selectABC('A'));
        btnOptB.addEventListener('click', () => selectABC('B'));
        btnOptC.addEventListener('click', () => selectABC('C'));

         // ✖️ PŘESKOČENÍ (S PŘEPNUTÍM RÁMEČKU A PŘEDÁNÍM MYŠI)
        btnQuizPass.addEventListener('click', () => {
            if (gameState.isClickLocked) return; 
            gameState.isClickLocked = true;
            
            // 🛑 OKAMŽITĚ ZASTAVÍME ČAS (Stejně jako při správné odpovědi)
            clearInterval(gameState.timerInterval);
            gameState.timerInterval = null;
            
            AudioEngine.play('wrong');
            const penalty = gameState.isTimeFrozen ? 8 : 3;
            
            // 1. Odečteme sekundy tomu, kdo zrovna mačkal "Nevím"
            if (gameState.activeTurnPlayer === 1) { 
                gameState.timers.p1 = Math.max(0, gameState.timers.p1 - penalty); 
                p1Timer.innerText = gameState.timers.p1.toFixed(1); 
            } else { 
                gameState.timers.p2 = Math.max(0, gameState.timers.p2 - penalty); 
                p2Timer.innerText = gameState.timers.p2.toFixed(1); 
            }
            
            // Kontrola, zda po této penalizaci někdo neprohrál
            if (gameState.timers.p1 <= 0 || gameState.timers.p2 <= 0) { 
                endDuel(); 
                return; 
            }
            
            // 2. Přepneme hráče na tahu a index otázky v pozadí
            gameState.currentQuestionIdx++; 
            gameState.activeTurnPlayer = gameState.activeTurnPlayer === 1 ? 2 : 1;
            
            // Zistíme jméno žáka, který má myš převzít
            const nextPlayerId = (gameState.activeTurnPlayer === 1) ? gameState.attackerIndex : gameState.defenderIndex;
            const nextPlayerCell = gameState.grid.find(c => c.originalOwner === nextPlayerId);
            
            // 3. Počkáme na doznění zvuku a vysuneme nápis pro předání myši (Rámeček se přepne až po kliknutí na Pokračovat)
            setTimeout(() => {
                document.getElementById('overlay-title').innerText = "🤝 PŘEDEJTE MYŠ!";
                document.getElementById('overlay-subtitle').innerText = `Na řadě je: ${nextPlayerCell ? nextPlayerCell.initials : 'Soupeř'}`;
                document.getElementById('game-overlay').classList.remove('hidden');
            }, 450);
        });
         
          // 3D: UKONČENÍ DUELU (S PERZISTENTNÍM ZACHOVÁNÍM PAUZY)
        function endDuel() {
            clearInterval(gameState.timerInterval); gameState.timerInterval = null; duelModal.classList.add('hidden');
            let winnerId = gameState.attackerIndex; let loserId = gameState.defenderIndex;
            if (gameState.timers.p1 <= 0) { winnerId = gameState.defenderIndex; loserId = gameState.attackerIndex; }
            else if (gameState.timers.p2 <= 0) { winnerId = gameState.attackerIndex; loserId = gameState.defenderIndex; }

            const winnerData = gameState.grid.find(c => c.originalOwner === winnerId);
            const loserData = gameState.grid.find(c => c.originalOwner === loserId);

            gameState.grid.forEach(cell => { if (cell.currentOwner === loserId && cell.currentOwner !== -1) cell.currentOwner = winnerId; });
            const isAttackerWinner = (winnerId === gameState.attackerIndex);
            
            AudioEngine.play('victory');
            document.getElementById('overlay-title').innerText = isAttackerWinner ? "⚔️ ÚTOČNÍK VYHRÁVÁ!" : "🛡️ OBRÁNCE SE UBRÁNIL!";
            document.getElementById('overlay-subtitle').innerText = `Žák [ ${winnerData.initials} ] ovládl území žáka [ ${loserData.initials} ]!`;
            document.getElementById('game-overlay').classList.remove('hidden');

            gameStatus.innerText = `💥 Duel skončil! Žák [ ${winnerData.initials} ] zvítězil nad [ ${loserData.initials} ].`;
            gameState.defenderIndex = null;
            if (checkGameEnd()) return;

            if (isAttackerWinner) { btnRandomize.classList.add('hidden'); btnPassTurn.classList.remove('hidden'); }
            else { gameState.attackerIndex = null; btnPassTurn.classList.add('hidden'); btnRandomize.classList.remove('hidden'); }
            renderFloor();
        }

        document.getElementById('btn-overlay-continue').addEventListener('click', () => {
            document.getElementById('game-overlay').classList.add('hidden');
            if (!duelModal.classList.contains('hidden')) {
                showNextQuestion(); 
                // 🔥 Čas se po předání myši rozběhne POUZE v případě, že není aktivní manuální pauza (T)
                if (!gameState.isTimeFrozen) startTimerLoop();
                gameState.isClickLocked = false;
            }
        });

        btnPassTurn.addEventListener('click', () => {
            gameState.attackerIndex = null; btnPassTurn.classList.add('hidden'); btnRandomize.classList.remove('hidden'); renderFloor();
        });

        function checkGameEnd() {
            const activeOwners = Array.from(new Set(gameState.grid.filter(c => !c.eliminated && c.currentOwner !== -1).map(c => c.currentOwner)));
            if (activeOwners.length === 1) {
                const absoluteWinner = gameState.grid.find(c => c.originalOwner === activeOwners);
                gameStatus.innerHTML = `🏆🏆 <strong>KONEC HRY! Žák [ ${absoluteWinner.initials} ] ovládl celou podlahu!</strong> 🏆🏆`;
                btnRandomize.classList.add('hidden'); btnPassTurn.classList.add('hidden'); renderFloor(); return true;
            }
            return false;
        }

        // ⌨️ OVLÁDÁNÍ KLÁVESAMI T A R (FUNGUJE KDYKOLIV BĚHEM HRY)
        window.addEventListener('keydown', (event) => {
            const indicator = document.getElementById('time-lock-indicator');
            
            if (event.key.toLowerCase() === 't') {
                if (!gameState.isTimeFrozen) {
                    gameState.isTimeFrozen = true; 
                    clearInterval(gameState.timerInterval); 
                    gameState.timerInterval = null;
                    if (indicator) { indicator.innerText = "PAUZA (T)"; indicator.style.backgroundColor = "var(--danger)"; }
                    gameStatus.innerText += " [Čas celkově pozastaven]";
                }
            } else if (event.key.toLowerCase() === 'r') {
                if (gameState.isTimeFrozen) {
                    gameState.isTimeFrozen = false;
                    if (indicator) { indicator.innerText = "ČAS BĚŽÍ"; indicator.style.backgroundColor = "var(--success)"; }
                    
                    // Čas znovu nahodíme pouze v případě, že se zrovna nacházíme v rozjetém duelu
                    if (!duelModal.classList.contains('hidden') && document.getElementById('game-overlay').classList.contains('hidden')) {
                        startTimerLoop();
                    }
                }
            }
        });
    </script>
</body>
